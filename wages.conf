# OpenCompany Wage Configuration
# Last updated: 2026-02-14

# Base minimum wage (update based on location/living wage)
# Federal minimum: $7.25 (2009, unchanged)
# Living wage estimate: $15.00 (2026)
min_wage=15.00

# Annual work hours (standard full-time)
year_hours=2080

# Position salary multipliers (minimum wage × hours × multiplier)
# Format: position_min and position_max

# Associate (entry-level contributor)
assoc_min=2.1
assoc_max=2.5

# Analyst (mid-level specialist)
analyst_min=2.6
analyst_max=3.5

# Manager (team lead, 4-5 direct reports)
manager_min=3.6
manager_max=4.7

# Director (division lead, 4 teams)
director_min=4.8
director_max=6.5

# C-Level (executive)
clevel_min=7
clevel_max=20

# Profit sharing
# Percentage of annual net profit to distribute
profit_share_percentage=15

# Profit share weights by position (relative)
assoc_profit_weight=1.0
analyst_profit_weight=1.5
manager_profit_weight=2.5
director_profit_weight=4.0
clevel_profit_weight=6.0
